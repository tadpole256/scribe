[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scribe-docs"
version = "0.1.0"
description = "Portable agent skills for generating and maintaining codebase documentation"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Anthony F. McCloskey" }]
keywords = ["documentation", "agents", "hermes", "openclaw", "diataxis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = ["typer>=0.12,<1"]

[dependency-groups]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.8"]

[project.scripts]
scribe = "scribe.cli:app"

[project.urls]
Homepage = "https://github.com/tadpole256/scribe"
Repository = "https://github.com/tadpole256/scribe"
Issues = "https://github.com/tadpole256/scribe/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
scribe = ["skills/**/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
